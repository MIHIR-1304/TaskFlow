version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: taskflow-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: taskflow_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network

  redis:
    image: redis:7.0-alpine
    container_name: taskflow-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - taskflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: always
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/taskflow_db
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: taskflow_super_secret_jwt_key_2026_mihir_portfolio_spring_boot
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge

volumes:
  mongo-data:
